// Notification settings
echo "=> Executing Message Configuration..."

// Frag information

notification_show_sprees "1"					// Print information about sprees in kill messages
notification_show_sprees_center_specialonly "1"	// Show sprees in center only if it's an achievement (3, 5, 10, ... kils)
notification_show_sprees_info_specialonly "1"	// Show sprees in chat/console only if it's an achievement (3, 5, 10, ... kils)
notification_show_sprees_center "1"				// Show messages in center
notification_show_sprees_info "3"				// Show spree in chat/console ( 0-off, 1-target, 2-attacker, 3-both )
notification_show_sprees_info_newline "1"		// Show spree in chat/console in separate line
notification_show_location "0"					// Append frag location in chat/console
// Show additional info in center (0-off, 1-default message, 2-verbose message)
