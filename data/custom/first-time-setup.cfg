// Run custom/setup.cfg and other commands intended to be executed only at first startup
//
// This file should be executed from autoexec/first-time-setup.cfg

echo "=> Running first time setup..."
defer 3 "playvol announcer/default/begin 0.5"



// First time setup
exec custom/profile.cfg		// User profile configuration



// setup.cfg
exec custom/setup.cfg		// Reset all configurations



echo "=> Done."
