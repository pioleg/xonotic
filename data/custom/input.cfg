// Input settings
echo "=> Executing Input Configuration..."

// Mouse
sensitivity "1.484416"		// Mouse sensitivity
m_yaw "0.022"				// Mouse yaw
m_pitch "0.022"				// Mouse pitch
m_filter "0"				// Mouse smootjing
m_accelerate "0"			// Mouse acceleration
menu_mouse_absolute "1"		// Use system mouse for menu
menu_mouse_cursormode "1"	// Menu mouse speed multiplier

// Other
con_closeontoggleconsole "1"	// Pressing console key also closes it
cl_movement_track_canjump "0"	// Auto repeat jump when holding
cl_jetpack_jump "1"				// Activate jetpack when jumping in the air (0-off, 1-stop on landing, 2-on)

//Key bindings
exec custom/binds.cfg