// Model settings
echo "=> Executing Models Configuration..."

// Items
cl_simple_items "1"				// 2D item images
cl_simpleitems_postfix "_luma"	// Sprite type (_luma or _simple)
cl_ghost_items "0.5"			// Unavailable item alpha
cl_ghost_items_color "-1 -1 -1"	// Unavailable item color ("-1 -1 -1"-black, "0 0 0"-unchanged, 0-1-darker, 1+-brighter)

// Players
cl_forceplayermodels "1"	// Force player models to mine
cl_forceplayercolors "1"	// Force player colors to mine (0-off, 1-non teams modes, 2-always, 3-duel, 4-team modes, 5-team modes and duel)
cl_deathglow "2"			// Body fading (seconds)
cl_nogibs "0"				// Reduce gibs (0-full gibs, 1-no gibs)

// Your model viewed by others
cl_forcemyplayercolors "68"						// Color
cl_forcemyplayermodel "models/player/nyx.iqm"	// Model
cl_forcemyplayerskin "1"						// Skin
