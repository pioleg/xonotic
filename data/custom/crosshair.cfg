// Crosshair settings
echo "=> Executing Crosshair Configuration..."

// Black circle (outline)
crosshair_enabled "2"			// Enable crosshair
crosshair_per_weapon "0"		// Crosshair per weapon
crosshair "32"					// Select crosshair
crosshair_size "0.25"			// Crosshait size
crosshair_alpha "1"				// Crosshair alpha
crosshair_color_special "0"		// Special color (0-off, 1-weapon color, 2-health, 3-random)
crosshair_color "0 0 0"			// Crosshair color

// Disable ring
crosshair_ring "0"				// Crosshair status ring

// White center dot
crosshair_dot "1"				// Enable center dot
crosshair_dot_size "1.6"		// Dot size
crosshair_dot_alpha "1"			// Dot alpha
crosshair_dot_color_custom "1"	// Use custom dot color
crosshair_dot_color "1 1 1"		// Dot color

// Crosshair effects
crosshair_effect_scalefade "0"	// Smooth effects
crosshair_effect_time "0"		// How long should the effects be
crosshair_hittest "0"			// Check if crosshair is obstructed
crosshair_hitindication "0"		// Animate on hit
crosshair_pickup "0"			// Animate on pickup
