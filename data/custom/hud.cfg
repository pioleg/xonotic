// HUD settings
echo "=> Executing HUD Configuration..."

//Scoreboard
hud_panel_scoreboard_bg_alpha "1"			// Scoreboard alpha
hud_panel_scoreboard_fadeinspeed "0"		// Scoreboard fade in SPEED (0 for instant)
hud_panel_scoreboard_fadeoutspeed "0"		// Scoreboard fade out SPEED (0 for instant)
hud_panel_scoreboard_table_highlight "1"	// Scoreboard row/column highlighting
hud_panel_scoreboard_accuracy "1"			// Show accuracy under the scoreboard
hud_panel_scoreboard_team_size_position "0"	// Show team sizes

// Waypoints
cl_hidewaypoints "0"						// Hide waypoints
g_waypointsprite_alpha "1"					// Waypoint alpha
g_waypointsprite_fontsize "12"				// Waypoint size
g_waypointsprite_crosshairfadealpha "0.25"	// Fade when near the crosshair
g_waypointsprite_text "0"				// Display names instead of icons
// Edge offset
g_waypointsprite_edgeoffset_bottom	"0.06"
g_waypointsprite_edgeoffset_top		"0.06"
g_waypointsprite_edgeoffset_left	"0.06"
g_waypointsprite_edgeoffset_right	"0.06"

// Player names
hud_shownames "1"						// Show names above players
hud_shownames_enemies "1"				// Show names above enemies
hud_shownames_alpha "1"					// Name alpha
hud_shownames_fontsize "12"				// Name size
hud_shownames_mindistance "1000"		// Maximal distance with max alpha
hud_shownames_maxdistance "5000"		// Maximal visible distance
hud_shownames_decolorize "1"			// Decolorize names (0-off, 1-team games, 2-always)
hud_shownames_crosshairdistance "25"	// Show full opacity only when in this distance from crosshair (0-off)
hud_shownames_status "1"				// Show health and armor in spec and team

// Other
hud_speed_unit "1"			// Speed unit (1-qu/s, 2-m/s, 3-km/h, 4-mph, 5-knots)
hud_damage "0"				// Damage overlay alpha
hud_dynamic_follow "0"		// HUD moves with player movement
hud_dynamic_shake "0"		// HUD shakes when taking damage

// HUD panels
exec custom/hud-panels.cfg
