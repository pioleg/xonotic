// View settings
echo "=> Executing View Configuration..."

// FOV
fov "104.821821"			// Field of view

// Camera
chase_active "0"			// Third person
cl_eventchase_death "2"		// Camera after death (0-first person, 1-third person when body stops, 2-third person)
cl_bobfall "0"				// Camera movement on landing (default 0.05)
cl_smoothviewheight "0"		// Camera smoothing time on crouch (default 0.05)
v_idlescale "0"				// Camera movement when idle
cl_bob "0"					// Camera movement when walking
cl_bob2 "0"					// Camera movement when walking
cl_clippedspectating "1"	// Stop spectator camera from clipping

// Zoom
cl_zoomfactor "2"						// Zoom factor
cl_zoomspeed "-1"						// Zoom speed (-1 for instant)
cl_zoomsensitivity "2"					// Zoom sensitivity (0-divided by cl_zoomfactor, 1-unchanged)
cl_velocityzoom_enabled "0"				// Enable FOV change when moving
cl_reticle "0"							// Display zoom reticle
cl_unpress_zoom_on_death "1"			// Release zoom on death
cl_unpress_zoom_on_spawn "1"			// Release zoom on spawn
cl_unpress_zoom_on_weapon_switch "0"	// Release zoom on weapon switch
