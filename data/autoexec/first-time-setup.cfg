// Run custom/first-time-setup.cfg only once.
//
// seta makes first_setup_done persistent by saving it to config.cfg.
// bx_if executes its second argument only when the first argument is nonzero.
// bx_if taken from https://forums.xonotic.org/showthread.php?tid=2987
//
// This file can be deleted after the first run



alias bx_noop ""
set bx_if_var_ ""								// create a variable that will hold the value which is being tested
// get tested value -> negate -> get action to execute -> get empty action -> execute correct action
alias bx_if "bx_if_var_ ${1}; toggle bx_if_var_; alias bx_if_action0_ ${2-}; alias bx_if_action1_ bx_noop; bx_if_do_"
// get tested value -> negate -> get empty action -> get action to execute -> execute correct action
alias bx_if_not "bx_if_var_ ${1}; toggle bx_if_var_; alias bx_if_action0_ bx_noop; alias bx_if_action1_ ${2-}; bx_if_do_"
alias bx_if_do_ "bx_if_action${bx_if_var_}_"	// bx_if_action0_ or bx_if_action1_ will be called depending on the variable


bx_if_not ${first_setup_done} exec custom/first-time-setup.cfg


seta first_setup_done 1
